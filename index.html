<html>
	<head>
		<title>flofloland</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Borel&display=swap" />
		<style>
			#header h1 { font-family: 'Borel', cursive; }
		</style>
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
		<link rel="manifest" href="/site.webmanifest">
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="bg"></div>
			<div id="overlay"></div>
			<div id="main">

				<!-- Header -->
					<header id="header">
						<h1>flofloland</h1>
						<p>floflo's amazing adventures :)</p>
						<nav>
							<ul>
								<li><a href="https://www.youtube.com/@flofloland" class="icon brands fa-youtube" id="yt-link"><span class="label">YouTube</span></a></li>
							</ul>
						</nav>
					</header>

				<!-- Footer -->
					<footer id="footer">
						<span class="copyright">&copy; flofloland.com&nbsp;&nbsp;&bull;&nbsp;&nbsp;html5 up</span>
					</footer>

			</div>
		</div>
		<script>
			window.onload = function() { document.body.classList.remove('is-preload'); }
			window.ontouchmove = function() { return false; }
			window.onorientationchange = function() { document.body.scrollTop = 0; }

			document.getElementById('yt-link').addEventListener('click', function(e) {
				var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
				if (isMobile) {
					e.preventDefault();
					// Try to open the YouTube app; fall back to browser after a short delay
					window.location = 'vnd.youtube://www.youtube.com/@flofloland';
					setTimeout(function() {
						window.location = 'https://www.youtube.com/@flofloland';
					}, 1500);
				}
			});
		</script>
	</body>
</html>
